---
- name: network-manager role
  tags:
  - network-manager
  block:

  # install
  - name: Apt install network-manager
    become: true
    ansible.builtin.apt:
      name: network-manager
      state: present

  # gather facts
  - name: Gather interface facts
    ansible.builtin.setup:
      filter:
      - ansible_interfaces

  # set fact
  - name: Set fact for primary wifi interface
    ansible.builtin.set_fact:
      __network_manager_primary_wifi: "{{ ansible_facts['interfaces'] | select('match', '^wl') | list | first }}"

  # debug
  - ansible.builtin.debug:
      var: __network_manager_primary_wifi

  # wifi connections
  - when: network_manager_connections_wifi | length > 0
    ansible.builtin.import_tasks: setup-wifi.yml

  # wireguard connections
  - when: network_manager_connections_wireguard | length > 0
    ansible.builtin.import_tasks: setup-wireguard.yml

  # dispatcher scripts
  - ansible.builtin.import_tasks: dispatcher.yml
